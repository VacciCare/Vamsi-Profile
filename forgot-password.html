
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | VacciCare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --primary: #2864e8;
            --primary-dark: #1f54d4;
            --background: #eef3fa;
            --text: #17243b;
            --muted: #75839a;
            --border: #cbd5e1;
            --white: #ffffff;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: linear-gradient(
                180deg,
                #f4f7fc 0%,
                #eaf1fa 100%
            );
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 390px;
            text-align: center;
        }

        /* VacciCare logo */

        .brand {
            margin-bottom: 30px;
        }

        .brand-name {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -0.8px;
            color: #17243b;
        }

        .shield {
            width: 29px;
            height: 33px;
            flex-shrink: 0;
        }

        .tagline {
            margin-top: 5px;
            font-size: 10px;
            color: #2864e8;
            letter-spacing: 0.3px;
        }

        /* Page heading */

        .heading {
            margin-bottom: 26px;
        }

        .heading h1 {
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #17243b;
        }

        .heading p {
            font-size: 13px;
            line-height: 1.6;
            color: #75839a;
        }

        /* Reset password card */

        .reset-card {
            background: var(--white);
            border: 1px solid #d3dce8;
            border-radius: 17px;
            padding: 23px 16px 18px;
            text-align: left;
            box-shadow: 0 5px 18px rgba(40, 70, 120, 0.035);
        }

        .field {
            margin-bottom: 21px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #526176;
        }

        .input-box {
            height: 48px;
            display: flex;
            align-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #fff;
            padding: 0 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(40, 100, 232, 0.10);
        }

        .input-icon {
            font-size: 17px;
            margin-right: 10px;
            color: #68788e;
        }

        .input-box input {
            width: 100%;
            min-width: 0;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 12px;
        }

        .input-box input::placeholder {
            color: #9aa6b6;
        }

        .toggle-password {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 5px;
            font-size: 16px;
        }

        .hint {
            margin-top: 7px;
            font-size: 10px;
            line-height: 1.5;
            color: #8794a7;
        }

        /* Validation message */

        .message {
            display: none;
            margin: 0 0 15px;
            font-size: 12px;
            line-height: 1.5;
            padding: 10px;
            border-radius: 8px;
        }

        .message.error {
            display: block;
            color: #b42318;
            background: #fff0ef;
        }

        .message.success {
            display: block;
            color: #18794e;
            background: #eaf8f0;
        }

        /* Reset button */

        .reset-btn {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 3px;
            transition: background 0.2s, transform 0.15s;
        }

        .reset-btn:hover {
            background: var(--primary-dark);
        }

        .reset-btn:active {
            transform: scale(0.98);
        }

        .back-link {
            margin-top: 21px;
            text-align: center;
            font-size: 12px;
            color: #68778c;
        }

        .back-link a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 23px;
            font-size: 10px;
            color: #8b98aa;
        }

        /* Mobile responsiveness */

        @media (max-width: 360px) {
            .container {
                max-width: 100%;
            }

            .brand-name {
                font-size: 23px;
            }

            .heading h1 {
                font-size: 23px;
            }

            .reset-card {
                padding: 20px 13px 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- VacciCare branding -->
        <header class="brand">
            <div class="brand-name">

                <svg class="shield"
                     viewBox="0 0 32 36"
                     xmlns="http://www.w3.org/2000/svg"
                     aria-label="VacciCare shield logo">
                    <path d="M16 2 L29 7 V17
                             C29 25 23 31 16 34
                             C9 31 3 25 3 17 V7 Z"
                          fill="#2864e8"/>
                    <path d="M16 6 L25 9.5 V17
                             C25 23 21 27.5 16 30
                             C11 27.5 7 23 7 17 V9.5 Z"
                          fill="#75a8ff"/>
                    <path d="M14 10 H18 V15 H23 V19 H18
                             V24 H14 V19 H9 V15 H14 Z"
                          fill="#ffffff"/>
                </svg>

                <span>VacciCare</span>
            </div>

            <p class="tagline">Your Health, Our Priority</p>
        </header>

        <!-- Page title -->
        <section class="heading">
            <h1>Reset Password</h1>
            <p>Create a new secure password for your account</p>
        </section>

        <!-- Reset form -->
        <form class="reset-card" id="resetForm">

            <div class="field">
                <label for="newPassword">New Password</label>

                <div class="input-box">
                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        class="toggle-password"
                        type="button"
                        data-target="newPassword"
                        aria-label="Show new password"
                        aria-pressed="false"
                    >👁</button>
                </div>

                <p class="hint">
                    Use at least 8 characters, including a letter and a number.
                </p>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>

                <div class="input-box">
                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        class="toggle-password"
                        type="button"
                        data-target="confirmPassword"
                        aria-label="Show confirm password"
                        aria-pressed="false"
                    >👁</button>
                </div>
            </div>

            <div id="message" class="message" role="status"
                 aria-live="polite"></div>

            <button class="reset-btn" type="submit">
                Reset Password
            </button>

        </form>

        <!-- Back to login -->
        <p class="back-link">
            Remember your password?
            <a href="login.html">Login</a>
        </p>

        <p class="security-note">
            🛡️ Your health and account security matter to us.
        </p>

    </main>

    <script>
        const form = document.getElementById("resetForm");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const message = document.getElementById("message");

        // Show or hide password
        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", () => {
                const input = document.getElementById(button.dataset.target);
                const showing = input.type === "password";

                input.type = showing ? "text" : "password";
                button.textContent = showing ? "🙈" : "👁";
                button.setAttribute("aria-pressed", String(showing));
                button.setAttribute(
                    "aria-label",
                    showing ? "Hide password" : "Show password"
                );
            });
        });

        // Display validation messages
        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const password = newPassword.value;
            const confirmation = confirmPassword.value;

            // Minimum password validation
            if (password.length < 8 ||
                !/[A-Za-z]/.test(password) ||
                !/[0-9]/.test(password)) {

                showMessage(
                    "Use at least 8 characters with a letter and a number.",
                    "error"
                );
                return;
            }

            // Check password confirmation
            if (password !== confirmation) {
                showMessage(
                    "Passwords do not match. Please try again.",
                    "error"
                );
                confirmPassword.focus();
                return;
            }

            /*
              Connect your backend reset-password API here.
              Do not change the password only in the browser.
            */

            showMessage(
                "Validation successful! Connect the reset-password API to save your new password.",
                "success"
            );
        });
    </script>

</body>
</html>
